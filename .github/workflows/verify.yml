name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@bdc8c076af1f4c5012a6ac3451a2009ec75bf921
        with:
          version: '0.10.22+124d61d05'
          core-version: '0.10.22+124d61d05'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: moon version --all
      - run: moon update
      - run: moon run --deny-warn scripts/verify.mbtx
      - run: moon run --deny-warn scripts/prepare-fixture.mbtx
      - run: git diff --exit-code
